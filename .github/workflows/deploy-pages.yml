name: Publish JobPilot website
on:
  push:
    branches: [main]
    paths:
      - index.html
      - style.css
      - app.js
      - push-client.js
      - sw.js
      - manifest.webmanifest
      - icon.svg
      - apple-touch-icon.png
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:
concurrency:
  group: jobpilot-pages
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare only publishable files
        run: |
          mkdir -p _site
          cp index.html style.css app.js push-client.js sw.js manifest.webmanifest icon.svg apple-touch-icon.png _site/
          # Preserve the previous *encrypted* Yahoo feed during a website-only deploy.
          # The scheduled scanner replaces it with a fresh encrypted copy later.
          if [[ -f feed.json ]]; then
            cp feed.json _site/
          else
            curl --fail --silent --show-error --location --max-time 15 \
              'https://abhiramgudapati.github.io/jobpilot-personal/feed.json' \
              -o _site/feed.json || echo 'No prior encrypted feed available yet.'
          fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy static website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}