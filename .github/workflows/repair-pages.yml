name: Release stale JobPilot Pages deployment
on:
  push:
    paths:
      - .github/workflows/repair-pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Cancel only the previously stuck Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments/3554fbbf324251f599134f485d34c7ecd9009f11/cancel"
