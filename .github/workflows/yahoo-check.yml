name: Scan Yahoo and publish encrypted JobPilot feed
on:
  workflow_dispatch:
  schedule:
    - cron: '11,41 * * * *'
concurrency:
  group: jobpilot-pages
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scanner dependencies
        run: python -m pip install -r worker/requirements.txt
      - name: Check Yahoo setup
        id: credentials
        shell: bash
        env:
          YAHOO_EMAIL: ${{ secrets.YAHOO_EMAIL }}
          YAHOO_APP_PASSWORD: ${{ secrets.YAHOO_APP_PASSWORD }}
          JOBPILOT_SYNC_KEY: ${{ secrets.JOBPILOT_SYNC_KEY }}
        run: |
          if [[ -z "$YAHOO_EMAIL" || -z "$YAHOO_APP_PASSWORD" || -z "$JOBPILOT_SYNC_KEY" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Yahoo secrets are not configured yet; skipping this scheduled scan."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Scan Yahoo and encrypt locally
        if: steps.credentials.outputs.configured == 'true'
        env:
          YAHOO_EMAIL: ${{ secrets.YAHOO_EMAIL }}
          YAHOO_APP_PASSWORD: ${{ secrets.YAHOO_APP_PASSWORD }}
          JOBPILOT_SYNC_KEY: ${{ secrets.JOBPILOT_SYNC_KEY }}
          JOBPILOT_TIMEZONE: America/Chicago
          JOBPILOT_PUSH_URL: ${{ secrets.JOBPILOT_PUSH_URL }}
          JOBPILOT_PUSH_TOKEN: ${{ secrets.JOBPILOT_PUSH_TOKEN }}
        run: python worker/yahoo_scan.py
      - name: Prepare static website and ciphertext (no secrets)
        if: steps.credentials.outputs.configured == 'true'
        run: |
          mkdir -p _site
          cp index.html style.css app.js push-client.js sw.js manifest.webmanifest icon.svg apple-touch-icon.png _site/
          cp feed.json _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        if: steps.credentials.outputs.configured == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.credentials.outputs.configured == 'true'
        with:
          path: _site
      - name: Publish website + updated encrypted feed to GitHub Pages
        if: steps.credentials.outputs.configured == 'true'
        id: deployment
        uses: actions/deploy-pages@v4